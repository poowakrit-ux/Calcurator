<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คำนวณค่างวดรถ</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#f4f4f4,#ffffff);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:400px;
    background:#fff;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

h2{
    text-align:center;
    color:#d60000;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    background:#d60000;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#b50000;
}

.result{
    margin-top:20px;
    background:#f8f8f8;
    padding:20px;
    border-radius:15px;
    text-align:center;
    line-height:2;
    font-size:20px;
    color:#d60000;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h2>🚗 คำนวณค่างวดรถ</h2>

<label>ราคารถ (บาท)</label>
<input type="number" id="price" placeholder="เช่น 689000">

<label>รูปแบบเงินดาวน์</label>
<select id="downType">
    <option value="percent">เปอร์เซ็นต์ (%)</option>
    <option value="amount">จำนวนเงิน (บาท)</option>
</select>

<label>เปอร์เซ็นต์เงินดาวน์ (%)</label>
<input type="number" id="downPercent" value="20">

<label>จำนวนเงินดาวน์ (บาท)</label>
<input type="number" id="downAmount" value="0">

<label>จำนวนงวด</label>
<select id="months">
    <option value="48">48 งวด</option>
    <option value="60">60 งวด</option>
    <option value="72">72 งวด</option>
    <option value="84">84 งวด</option>
</select>

<label>ดอกเบี้ยต่อปี (%)</label>
<input type="number" id="interest" value="2.99">

<button onclick="calculate()">คำนวณค่างวด</button>

<div class="result" id="result">
กรุณากรอกข้อมูล
</div>

</div>

<script>

function calculate(){

let price = parseFloat(document.getElementById("price").value);
let months = parseInt(document.getElementById("months").value);
let interest = parseFloat(document.getElementById("interest").value);
let downType = document.getElementById("downType").value;

let downAmount = 0;

if(downType=="percent"){
    let downPercent = parseFloat(document.getElementById("downPercent").value);
    downAmount = price * downPercent / 100;
}
else{
    downAmount = parseFloat(document.getElementById("downAmount").value);
}

let finance = price - downAmount;

let totalInterest = finance * interest / 100 * (months/12);

let totalPay = finance + totalInterest;

let monthly = totalPay / months;

document.getElementById("result").innerHTML =

"ยอดจัด : " + finance.toLocaleString() + " บาท<br><br>" +
"เงินดาวน์ : " + downAmount.toLocaleString() + " บาท<br><br>" +
"ค่างวดประมาณ : " + monthly.toLocaleString(undefined,{maximumFractionDigits:0}) + " บาท/เดือน";

}

</script>

</body>
</html>
